<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>台北捷運即時列車位置</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">M</span>
      <div class="brand-text">
        <h1 data-i18n="title">台北捷運即時列車位置</h1>
        <p id="dataModeLabel" class="data-mode">載入中…</p>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="api.html" class="icon-btn link-btn" data-i18n="apiLink" title="API 說明">API</a>
      <button id="langToggle" class="icon-btn" aria-label="切換語言">中</button>
      <button id="sidebarToggle" class="icon-btn" aria-label="開啟選單">☰</button>
      <button id="themeToggle" class="icon-btn" aria-label="切換深色模式">🌙</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <section class="panel">
        <h2 data-i18n="lineFilters">路線篩選</h2>
        <div id="lineFilters" class="line-filters"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="stationQuery">車站到站時間查詢</h2>
        <input id="stationSearch" type="search" data-i18n-placeholder="stationPlaceholder" placeholder="輸入車站名稱，例如：台北車站" />
        <div id="stationResults" class="station-results"></div>
      </section>

      <section class="panel" id="arrivalPanel" hidden>
        <h2 id="arrivalStationName">到站資訊</h2>
        <div id="arrivalList" class="arrival-list"></div>
      </section>

      <section class="panel legend">
        <h2 data-i18n="legend">圖例</h2>
        <p><span class="dot train-dot"></span> <span data-i18n="legendTrain">列車（依到站時間估算位置）</span></p>
        <p><span class="dot station-dot"></span> <span data-i18n="legendStation">車站</span></p>
        <p class="note" data-i18n="legendNote">列車位置為依「到站時間預估」內插推算之近似位置，非車輛實際 GPS 座標。</p>
      </section>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div id="updateBadge" class="update-badge" data-i18n="notUpdated">尚未更新</div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
